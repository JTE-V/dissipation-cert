name: Draft PDF

on: [push, workflow_dispatch]

jobs:
  paper:
    runs-on: ubuntu-latest
    name: Paper Draft
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Compile paper
        run: |
          mkdir -p build
          cp paper.md paper.bib build/
          docker run --rm \
            --volume "$PWD/build:/data" \
            --user $(id -u):$(id -g) \
            --env JOURNAL=joss \
            ghcr.io/openjournals/inara:latest
          echo "=== produced files ==="
          ls -la build

      - name: Upload
        uses: actions/upload-artifact@v6
        with:
          name: paper
          path: build/*.pdf
          if-no-files-found: error
