name: Draft PDF

on: [push, workflow_dispatch]

jobs:
  paper:
    runs-on: ubuntu-latest
    name: Paper Draft
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: List files
        if: always()
        run: ls -la

      - name: Upload
        uses: actions/upload-artifact@v6
        with:
          name: paper
          path: '**/*.pdf'
          if-no-files-found: error
