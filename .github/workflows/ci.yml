name: CI

on: [push, pull_request, workflow_dispatch]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: coefficients
        run: python3 dissipation_cert.py exact
      - name: selfcheck
        run: python3 dissipation_cert.py selfcheck
      - name: bound
        run: python3 dissipation_cert.py bound
      - name: stair diagnostic
        run: python3 stair_diag.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stair-diag-py${{ matrix.python-version }}
          path: |
            stair_diag.csv
            stair_diag.svg
