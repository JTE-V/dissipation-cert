name: CI

on: [push, pull_request, workflow_dispatch]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11","3.12","3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: coefficients
        run: python3 dissipation_cert.py exact
      - name: selfcheck
        run: python3 dissipation_cert.py selfcheck
      - name: bound
        run: python3 dissipation_cert.py bound
      - name: stair diagnostic
        run: python3 stair_diag.py
      - name: tests
        run: python3 test_all.py
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: stair-diag-py${{ matrix.python-version }}
          path: |
            stair_diag.csv
            stair_diag.svg
